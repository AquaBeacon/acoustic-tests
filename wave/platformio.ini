; AquaBeacon - 波形実験プロジェクト (root から分離)
;   本実装(測距)は tx/ rx/ を参照。ここは搬送波の実験/確認専用。
;
;   env:wave  -> waveTest.cpp : 200kHz を連続出力し続ける (既定)
;   env:burst -> main.cpp     : 5波バーストを1秒周期で送信 (参考)
;
; パラメータは common/aquabeacon_config.h を参照する (-I../common)。

[env:wave]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
monitor_speed = 115200
build_flags = -I../common
build_src_filter = +<waveTest.cpp> -<main.cpp>

[env:burst]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
monitor_speed = 115200
build_flags = -I../common
build_src_filter = +<main.cpp> -<waveTest.cpp>
